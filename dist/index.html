<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b1a30">
    <link rel="apple-touch-icon" href="./icons/Pisgahpavicon.png">
    <title>PISGAH-BISDAC App</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icons/Pisgahpavicon.png">
    <link rel="icon" type="image/png" href="./icons/Pisgahpavicon.png">
    <link rel="apple-touch-icon" href="./icons/Pisgahpavicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>
        html.dark {
            background-color: #0b1a30 !important;
            color-scheme: dark;
        }

        html.dark body {
            background-color: #0b1a30 !important;
        }
    </style>

    <script>
        // Set tema awal sebelum React render untuk mencegah FOUC (Flash of Unstyled Content)
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0b1a30';
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f9fafb';
        }

        // Hapus index.html dari URL bar secara instan jika pengguna mengakses langsung
        try {
            if (window.location.pathname.endsWith('/index.html')) {
                var cleanPath = window.location.pathname.replace(/\/index\.html$/, '') || '/';
                var cleanUrl = window.location.origin + cleanPath + window.location.search + window.location.hash;
                window.history.replaceState(null, '', cleanUrl);
            }
        } catch (e) { }
    </script>

    <!-- Header Anti-Cache untuk index.html agar selalu memuat chunk JS versi terbaru saat ada edit baru -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Penanganan otomatis error chunk versi lama (setelah deploy/edit baru)
        window.addEventListener('vite:preloadError', function () {
            console.warn('[PISGAH] Chunk baru terdeteksi setelah pembaruan. Memuat ulang aplikasi otomatis...');
            window.location.reload();
        });
        window.addEventListener('error', function (e) {
            var msg = (e && e.message) ? e.message.toLowerCase() : '';
            if (msg.includes('dynamically imported module') || msg.includes('loading chunk') || msg.includes('importing a module script failed') || msg.includes('failed to fetch')) {
                var key = 'pisgah_last_chunk_reload';
                var last = sessionStorage.getItem(key);
                if (!last || Date.now() - Number(last) > 8000) {
                    sessionStorage.setItem(key, String(Date.now()));
                    console.warn('[PISGAH] Chunk modul gagal dimuat. Memuat ulang bersih...');
                    window.location.reload();
                }
            }
        }, true);
    </script>



    <!-- HAPUS SCRIPT LUCIDE KARENA ANDA SUDAH MEMILIKI KOMPONEN ICON CUSTOM (Mengurangi beban download) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
        crossorigin="anonymous" defer></script>
    <!-- Library untuk konversi HEIC/HEIF ke format standard -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>

  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/vendor-react-B3MA8LmQ.js">
  <link rel="stylesheet" crossorigin href="/assets/index-kWRZ7iqD.css">
</head>

<body
    class="bg-gray-50 dark:bg-[#0b1a30] text-navy-900 dark:text-gray-100 font-sans antialiased overflow-x-clip transition-colors duration-300">
    <div id="root">
        <!-- Preloader: Ditampilkan saat React & Babel sedang diproses, mencegah blank screen lambat -->
        <div class="preloader-bg" id="app-preloader"
            style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
            <style>
                .preloader-bg {
                    background-color: rgba(255, 255, 255, 0.4);
                }

                .spinner-raw {
                    position: absolute;
                    inset: 0;
                    border: 4px solid rgba(74, 112, 69, 0.2);
                    border-top-color: #4A7045;
                    border-radius: 50%;
                    animation: spin-raw 1s linear infinite;
                    box-shadow: 0 0 20px rgba(74, 112, 69, 0.1);
                }

                @keyframes spin-raw {
                    100% {
                        transform: rotate(360deg);
                    }
                }

                @keyframes pulse-raw {

                    0%,
                    100% {
                        transform: scale(1);
                        opacity: 1;
                    }

                    50% {
                        transform: scale(0.9);
                        opacity: 0.7;
                    }
                }

                @media (prefers-color-scheme: dark) {
                    .preloader-bg {
                        background-color: rgba(15, 23, 42, 0.4);
                    }

                    .spinner-raw {
                        border: 4px solid rgba(212, 175, 55, 0.2);
                        border-top-color: #D4AF37;
                        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
                    }
                }
            </style>
            <div
                style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
                <div class="spinner-raw"></div>
                <img src="./icons/PisgahColor.png"
                    style="width: 45px; height: 45px; object-fit: contain; animation: pulse-raw 2s ease-in-out infinite;"
                    alt="Loading Logo">
            </div>

            <!-- Rescue button jika koneksi atau Service Worker lama bermasalah -->
            <div id="preloader-rescue"
                style="display: none; margin-top: 24px; text-align: center; z-index: 10000; position: relative;">
                <p style="font-size: 13px; color: #D4AF37; font-weight: 700; margin-bottom: 8px;">Memuat memakan waktu
                    lebih lama dari biasanya...</p>
                <button onclick="window.clearAppCacheAndReload()"
                    style="padding: 10px 18px; background: #D4AF37; color: #0b1a30; border: none; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.3); transition: transform 0.2s;">
                    🔄 Muat Ulang Bersih (Clear Cache)
                </button>
            </div>
        </div>
    </div>

    <script>
        // Nonaktifkan & bersihkan service worker jika sedang berjalan di mode development (localhost / port dev)
        var isDevEnv = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.port === '4000' ||
            window.location.port === '5173' ||
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.startsWith('10.') ||
            window.location.hostname.endsWith('.local');

        if (isDevEnv && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
            }).catch(function () { });
        }

        // Fungsi darurat untuk membersihkan cache service worker jika loading terhambat
        window.clearAppCacheAndReload = async function () {
            var btn = document.querySelector('#preloader-rescue button');
            if (btn) {
                btn.disabled = true;
                btn.innerText = '⏳ Membersihkan Cache & Memuat Ulang...';
            }
            try {
                if ('serviceWorker' in navigator) {
                    var regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(function (r) { return r.unregister(); }));
                }
                if ('caches' in window) {
                    var names = await caches.keys();
                    await Promise.all(names.map(function (name) { return caches.delete(name); }));
                }
                sessionStorage.clear();
            } catch (e) {
                console.error('Clear cache error:', e);
            }
            window.location.reload();
        };

        // Tampilkan tombol rescue HANYA jika dalam 12 detik React benar-benar belum me-mount
        setTimeout(function () {
            var rescue = document.getElementById('preloader-rescue');
            var preloader = document.getElementById('app-preloader') || document.querySelector('.preloader-bg');
            if (rescue && preloader && preloader.parentNode) {
                rescue.style.display = 'block';
            }
        }, 12000);
    </script>

</body>

</html>
