<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/svg+xml" href="./icons/PisgahColor.png">
    <link rel="icon" type="image/png" href="./icons/PisgahColor.png">
    <link rel="apple-touch-icon" href="./icons/PisgahColor.png">
    <meta name="theme-color" content="#151924">


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <style>
        #app-preloader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #050814;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #app-preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(245, 158, 11, 0.3);
            border-top: 4px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body
    class="antialiased min-h-screen relative overflow-x-hidden bg-slate-50 dark:bg-[#050814] text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Preloader Instan -->
    <div id="app-preloader">
        <div class="spinner"></div>
        <h2
            style="color: #f59e0b; font-weight: 800; font-size: 1.25rem; margin-top: 1.5rem; letter-spacing: 0.05em; font-family: 'Inter', sans-serif;">
            PISGAH BISDAC</h2>
        <p style="color: #64748b; font-size: 0.875rem; margin-top: 0.5rem; font-family: 'Inter', sans-serif;">Menyiapkan
            Sistem...</p>
    </div>

    <!-- Background Decoration -->
    <div class="fixed inset-0 bg-slate-100 dark:bg-[#040712] overflow-hidden -z-10 transition-colors duration-300">
        <div
            class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] rounded-full bg-blue-400/20 dark:bg-blue-900/15 blur-[140px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-amber-400/20 dark:bg-amber-500/10 blur-[140px]">
        </div>
    </div>

    <div id="root">
        <!-- Skullet First-Paint Skeleton Preloader: Menampilkan layout wireframe presensi jemaat instan -->
        <div class="min-h-screen p-4 sm:p-6 md:p-8 flex flex-col max-w-7xl mx-auto transition-colors duration-300">
            <style>
                @keyframes sk-hadir-shimmer {
                    0% { transform: translateX(-100%); }
                    100% { transform: translateX(100%); }
                }
                @keyframes sk-hadir-pulse {
                    0%, 100% { transform: scale(1); opacity: 1; }
                    50% { transform: scale(0.95); opacity: 0.75; }
                }
                .sk-h-bone {
                    position: relative;
                    overflow: hidden;
                    background: rgba(226, 232, 240, 0.75);
                    border-radius: 12px;
                }
                .sk-h-bone::after {
                    content: "";
                    position: absolute;
                    inset: 0;
                    transform: translateX(-100%);
                    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
                    animation: sk-hadir-shimmer 1.8s ease-in-out infinite;
                }
                @media (prefers-color-scheme: dark) {
                    .sk-h-bone { background: rgba(30, 41, 59, 0.65); }
                    .sk-h-bone::after {
                        background: linear-gradient(90deg, transparent 0%, rgba(197, 168, 128, 0.15) 50%, transparent 100%);
                    }
                }
                .dark .sk-h-bone { background: rgba(30, 41, 59, 0.65); }
                .dark .sk-h-bone::after {
                    background: linear-gradient(90deg, transparent 0%, rgba(197, 168, 128, 0.15) 50%, transparent 100%);
                }
            </style>

            <!-- 1. Header Bar Wireframe -->
            <div class="flex items-center justify-between pb-6 border-b border-slate-200/70 dark:border-slate-800/80">
                <div class="flex items-center gap-3">
                    <div style="width: 44px; height: 44px;" class="sk-h-bone rounded-2xl flex items-center justify-center shrink-0">
                        <img src="./icons/PisgahColor.png" style="width: 28px; height: 28px; animation: sk-hadir-pulse 2s ease-in-out infinite;" alt="Logo GMAHK">
                    </div>
                    <div class="space-y-1.5">
                        <div class="sk-h-bone" style="width: 200px; height: 18px;"></div>
                        <div class="sk-h-bone" style="width: 130px; height: 12px;"></div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="sk-h-bone" style="width: 100px; height: 36px; border-radius: 9999px;"></div>
                </div>
            </div>

            <!-- 2. Stat Cards Row Wireframe -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 my-6">
                <div class="p-4 rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 space-y-2">
                    <div class="sk-h-bone" style="width: 70px; height: 12px;"></div>
                    <div class="sk-h-bone" style="width: 50px; height: 26px;"></div>
                </div>
                <div class="p-4 rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 space-y-2">
                    <div class="sk-h-bone" style="width: 80px; height: 12px;"></div>
                    <div class="sk-h-bone" style="width: 50px; height: 26px;"></div>
                </div>
                <div class="p-4 rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 space-y-2">
                    <div class="sk-h-bone" style="width: 75px; height: 12px;"></div>
                    <div class="sk-h-bone" style="width: 50px; height: 26px;"></div>
                </div>
                <div class="p-4 rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 space-y-2">
                    <div class="sk-h-bone" style="width: 90px; height: 12px;"></div>
                    <div class="sk-h-bone" style="width: 50px; height: 26px;"></div>
                </div>
            </div>

            <!-- 3. Presensi Table Wireframe -->
            <div class="p-5 rounded-3xl border border-slate-200/70 dark:border-slate-800 bg-white/70 dark:bg-slate-900/40 space-y-3.5 flex-1">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                    <div class="sk-h-bone" style="width: 160px; height: 18px;"></div>
                    <div class="flex gap-2">
                        <div class="sk-h-bone" style="width: 70px; height: 30px; border-radius: 9999px;"></div>
                        <div class="sk-h-bone" style="width: 70px; height: 30px; border-radius: 9999px;"></div>
                    </div>
                </div>
                <div class="space-y-2.5 pt-1">
                    <div class="sk-h-bone" style="width: 100%; height: 50px;"></div>
                    <div class="sk-h-bone" style="width: 100%; height: 50px;"></div>
                    <div class="sk-h-bone" style="width: 100%; height: 50px;"></div>
                    <div class="sk-h-bone" style="width: 100%; height: 50px;"></div>
                    <div class="sk-h-bone" style="width: 100%; height: 50px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SESUDAH -->



    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <!-- jsPDF & XLSX dimuat setelah app siap, tidak blocking render -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"
        defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>


    <script type="module" src="/src/hadir.jsx"></script>
    <script>
        let _hadirLastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const fabs = document.querySelectorAll('#floatingSyncBtn, .floating-btn');
            fabs.forEach(fab => {
                if (currentScrollY > _hadirLastScrollY && currentScrollY > 50) {
                    fab.style.transform = 'translateY(100px)';
                    fab.style.opacity = '0';
                    fab.style.pointerEvents = 'none';
                } else if (currentScrollY < _hadirLastScrollY) {
                    fab.style.transform = '';
                    fab.style.opacity = '1';
                    fab.style.pointerEvents = 'auto';
                }
            });
            _hadirLastScrollY = currentScrollY;
        }, { passive: true });
    </script>
</body>

</html>
